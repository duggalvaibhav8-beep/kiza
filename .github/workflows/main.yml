name: next git

on:
  push:
    branches: ['main']

jobs:
  run-app:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: cmd


    steps:
      - uses: actions/checkout@v4
      - name: Install frontend-kiza
        run: npm install
        working-directory: frontend-kiza

      - name: Start frontend-kiza
        run: |
          pm2 delete angular-front || exit /b 0
          pm2 start "npx ng serve --host 0.0.0.0 --port 4200" --name angular-front
        working-directory: frontend-kiza

      - name: Install backend
        run: npm install
        working-directory: backend

      - name: Start backend
        run: |
          pm2 delete node-backend || exit /b 0
          pm2 start server.js --name node-backend
        working-directory: backend


        
      


